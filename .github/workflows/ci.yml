name: CI

# Public repository: standard GitHub-hosted runners cost no minutes, so every push runs the full
# suite on Linux, Windows and macOS. The jobs run in parallel and are kept few, because the
# account's concurrent-job limit (20 jobs, 5 macOS on the Free plan) is shared with its other
# repositories.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# A newer push makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Lint, types, unit tests and every integration variant on the fastest OS.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run vsix
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: vscode-test-${{ runner.os }}-
      - name: Download VS Code (with retries)
        run: node .github/scripts/download-vscode.mjs stable 1.90.0
      - name: Integration tests (VS Code stable)
        run: xvfb-run -a npm run test:integration
      - name: Integration tests (minimum supported VS Code)
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_TEST_VERSION: 1.90.0
      - name: Integration tests against the packaged .vsix
        run: |
          unzip -q "$(ls *.vsix)" -d packaged
          node esbuild.mjs --tests
          VSCODE_TEST_EXTENSION_PATH="$PWD/packaged/extension" xvfb-run -a npx vscode-test
      - uses: actions/upload-artifact@v4
        with:
          name: branch-and-brew-vsix
          path: '*.vsix'
          retention-days: 7

  # Windows and macOS: unit tests and integration tests on VS Code stable.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Keep Defender away from node_modules (file IO is the slow part on Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-stable-${{ hashFiles('package-lock.json') }}
          restore-keys: vscode-test-${{ runner.os }}-stable-
      - name: Download VS Code (with retries)
        run: node .github/scripts/download-vscode.mjs stable
      - run: npm run test:integration

  # The oldest supported VS Code, in its own job so it does not lengthen the run.
  minimum-vscode:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Keep Defender away from node_modules (file IO is the slow part on Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-1.90.0-${{ hashFiles('package-lock.json') }}
          restore-keys: vscode-test-${{ runner.os }}-1.90.0-
      - name: Download VS Code (with retries)
        run: node .github/scripts/download-vscode.mjs 1.90.0
      - run: npm run test:integration
        env:
          VSCODE_TEST_VERSION: 1.90.0

  # The packaged .vsix, unpacked and run, on Windows and macOS.
  packaged:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Keep Defender away from node_modules (file IO is the slow part on Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run vsix
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-stable-${{ hashFiles('package-lock.json') }}
          restore-keys: vscode-test-${{ runner.os }}-stable-
      - name: Download VS Code (with retries)
        run: node .github/scripts/download-vscode.mjs stable
      - name: Integration tests against the packaged .vsix (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item (Get-Item *.vsix).FullName packaged.zip
          Expand-Archive packaged.zip -DestinationPath packaged
          node esbuild.mjs --tests
          $env:VSCODE_TEST_EXTENSION_PATH = (Resolve-Path packaged/extension).Path
          npx vscode-test
      - name: Integration tests against the packaged .vsix (macOS)
        if: runner.os == 'macOS'
        run: |
          unzip -q "$(ls *.vsix)" -d packaged
          node esbuild.mjs --tests
          VSCODE_TEST_EXTENSION_PATH="$PWD/packaged/extension" npx vscode-test
