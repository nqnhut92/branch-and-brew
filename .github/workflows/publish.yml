name: Publish

# Runs when a version tag such as v1.1.0 is pushed: packages the extension, publishes it to the
# Visual Studio Marketplace and attaches the .vsix to a GitHub release. One job, so it adds one to
# the account's shared concurrent-job limit only while a release is made.
#
# The Marketplace login is Trusted Publishing: a short-lived token that GitHub issues for this
# workflow (`id-token: write`) and the publisher `nqnhut92` accepts for this repository and this
# file name (Marketplace > publisher > Trusted Publishing). No token is stored in the repository.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The tag must name the version in package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run vsix
      - name: Publish to the Marketplace
        run: npx vsce publish --oidc --packagePath "branch-and-brew-${GITHUB_REF_NAME#v}.vsix"
      - name: GitHub release with the .vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "${GITHUB_REF_NAME}" "branch-and-brew-${version}.vsix" \
            --title "${GITHUB_REF_NAME} - Branch and Brew" --notes-file notes.md
